name: Momentum Android APK
on:
  push:
    branches: [fix/momentum-android-138]
    paths:
      - 'momentum-android/**'
      - '.github/workflows/momentum-android-build.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile debug APK
        run: gradle -p momentum-android :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MomentumSport-v1.3.8-clean
          path: momentum-android/app/build/outputs/apk/debug/app-debug.apk
